  <script>
    const clipCache = new WeakMap();
    const playerCache = new WeakMap();
    function clipsFor(section) {
      if (!clipCache.has(section)) {
        clipCache.set(section, JSON.parse(section.querySelector('.step-clips').textContent));
      }
      return clipCache.get(section);
    }
    function stepFor(section) {
      return Math.max(0, ...Array.from(section.querySelectorAll('.step-anchor.visible'),
        fragment => Number(fragment.dataset.step)));
    }
    function playerFor(section) {
      if (!playerCache.has(section)) {
        const active = section.querySelector('video');
        const standby = active.cloneNode(false);
        standby.classList.remove('is-active');
        standby.removeAttribute('src');
        standby.removeAttribute('poster');
        standby.preload = 'auto';
        standby.setAttribute('aria-hidden', 'true');
        section.insertBefore(standby, active);
        playerCache.set(section, {active, standby, request: 0, pending: null});
      }
      return playerCache.get(section);
    }
    function showStep(section, index, animate) {
      const player = playerFor(section);
      player.active.pause();
      // Keep the outgoing decoded frame visible while the next clip loads.
      // Reloading the only visible video exposes its poster/blank decode frame
      // between reveals, particularly for the larger 4K clips.
      const video = player.standby;
      const clip = clipsFor(section)[index];
      const request = ++player.request;
      if (player.pending) player.pending.abort();
      const pending = new AbortController();
      player.pending = pending;
      video.dataset.request = String(request);
      video.preload = 'auto';
      video.pause();
      delete video.dataset.playbackError;
      video.dataset.step = String(index);
      const current = () => player.request === request &&
        section === Reveal.getCurrentSlide();
      const expose = () => {
        // loadeddata/seeked guarantee a decoded frame; one paint boundary makes
        // the visibility swap atomic, without fading or advancing the slide.
        requestAnimationFrame(() => {
          if (!current()) return;
          const outgoing = player.active;
          outgoing.pause();
          video.classList.add('is-active');
          video.removeAttribute('aria-hidden');
          outgoing.classList.remove('is-active');
          outgoing.setAttribute('aria-hidden', 'true');
          player.active = video;
          player.standby = outgoing;

          } else {
            video.pause();
          }

      };

        if (!current()) return;
        const target = animate ? 0 : Math.max(0, video.duration - 1 / 120);
        if (Math.abs(video.currentTime - target) > 1e-5) {
          video.addEventListener('seeked', expose, {once: true, signal: pending.signal});
          video.currentTime = target;
        } else {
          expose();
        }

      video.addEventListener('loadeddata', ready, {once: true, signal: pending.signal});

    Reveal.on('fragmenthidden', () => {

    let selectingFromOverview = false;
    canvas.addEventListener('pointerdown', () => {
      selectingFromOverview = Reveal.isOverview();
    }, true);
    canvas.addEventListener('click', event => {

      if (fromOverview || event.target.closest('button, a, .controls') || Reveal.isOverview()) return;

    Reveal.initialize({
      width: 3840,
      height: 2160,
      margin: 0,
      controls: true,
      progress: true,
      slideNumber: 'c/t',
      hash: true,
      fragmentInURL: true,
      autoSlide: 0,
      keyboard: {13: 'next'},
      transition: 'none',
      backgroundTransition: 'none'
    });
